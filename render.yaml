services:
  - type: web
    name: estatedb
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: estatedb-pg
          property: connectionString

databases:
  - name: estatedb-pg
    databaseName: estatedb
    user: estatedb_user
    plan: free
